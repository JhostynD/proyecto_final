<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="appleBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1490FF" />
      <stop offset="100%" stop-color="#0066E0" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#003E99" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base (Apple style app icon) -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#appleBlue)" filter="url(#shadow)" />

  <!-- Ticket Body with Top & Bottom Notches -->
  <path d="
    M 180 128
    H 232
    A 24 24 0 0 1 280 128
    H 332
    A 28 28 0 0 1 360 156
    V 356
    A 28 28 0 0 1 332 384
    H 280
    A 24 24 0 0 1 232 384
    H 180
    A 28 28 0 0 1 152 356
    V 156
    A 28 28 0 0 1 180 128
    Z"
    fill="#FFFFFF"
  />

  <!-- Checkmark inside ticket -->
  <path d="M 212 264 L 246 298 L 302 216"
    stroke="url(#appleBlue)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>